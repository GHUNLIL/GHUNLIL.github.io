name: Update GitHub contribution calendar

on:
  push:
    paths:
      - ".github/workflows/update-github-contributions.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GHUNLIL public contributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          from_date="$(date -u -d '133 days ago' +'%Y-%m-%dT00:00:00Z')"
          to_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          gh api graphql \
            -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){login contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount contributionLevel}}}}}}' \
            -F login=GHUNLIL \
            -F from="$from_date" \
            -F to="$to_date" \
            > "$RUNNER_TEMP/github-contributions-source.json"

          jq --arg updated_at "$to_date" '{
            login: .data.user.login,
            totalContributions: .data.user.contributionsCollection.contributionCalendar.totalContributions,
            updatedAt: $updated_at,
            contributions: (
              .data.user.contributionsCollection.contributionCalendar.weeks
              | map(.contributionDays)
              | add
              | map({
                  date,
                  count: .contributionCount,
                  level: ({
                    "NONE": 0,
                    "FIRST_QUARTILE": 1,
                    "SECOND_QUARTILE": 2,
                    "THIRD_QUARTILE": 3,
                    "FOURTH_QUARTILE": 4
                  }[.contributionLevel])
                })
            )
          }' "$RUNNER_TEMP/github-contributions-source.json" \
            > static/github-contributions-GHUNLIL.json

      - name: Commit updated calendar
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- static/github-contributions-GHUNLIL.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/github-contributions-GHUNLIL.json
          git commit -m "Update GHUNLIL contribution calendar"
          git push
